<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The SWG Circular — Southern Writers Guild</title>
  <link rel="stylesheet" href="/css/swg.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link"><img src="/assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo"></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/">The Work</a></li>
        <li><a href="/events/">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/">Writers</a></li>
        <li><a href="/contributors/">Contributors</a></li>
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <main class="section circ-page">
    <div class="container circ-piece" id="circ-piece">
      <p class="circ-loading">Loading…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    // /circular/<issue>/<piece>/ — one piece, reachable only through its
    // issue. The piece is found inside the issue by its address, which is
    // made from its title; see issuePieces() in js/circular.js.
    import { fetchIssue, renderPiece, publicationName } from '/js/circular.js'
    import { stegaClean } from '@sanity/client/stega'

    const el = document.getElementById('circ-piece')
    const parts = window.location.pathname.split('/').filter(Boolean)
    const address = parts[1] || ''
    const slug = parts[2] || ''

    function missing(msg) {
      el.innerHTML = `<div class="circ-missing"><p>${msg}</p><p><a href="/circular/${address}/" class="circ-button">Go to the issue &#8594;</a></p></div>`
    }

    fetchIssue(address)
      .then(issue => {
        const piece = issue && renderPiece(issue, slug)
        if (!piece) return missing('We couldn’t find that piece.')
        document.title = `${piece.title} — ${publicationName(issue)} — Southern Writers Guild`
        el.innerHTML = piece.html
      })
      .catch(() => missing('Something went wrong loading this piece.'))
  </script>

  <script src="/js/nav.js"></script>
</body>
</html>
