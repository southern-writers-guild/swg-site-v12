<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Southern Writers Guild</title>
  <meta name="description" content="Readings, fairs, and gatherings from the Southern Writers Guild.">
  <link rel="stylesheet" href="../css/swg.css">
  <style>
    .events-header {
      padding: 48px 60px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .events-label {
      font-size: 14px;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .events-tagline {
      font-family: var(--serif, 'Cormorant Garamond', Georgia, serif);
      font-size: 15px;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .events-divider { border: none; border-top: 1px solid var(--border); margin: 0; }
    .events-grid-wrap { padding: 44px 60px 0; }
    .event-features { display: grid; gap: 24px; }
    .event-feature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }
    .event-feature-flyer { display: block; }
    .event-feature-body .card-title { font-size: 1.8rem; margin: 0.25rem 0 0.75rem; }
    .event-feature-text { margin-top: 1.5rem; }
    .event-feature-text > :last-child { margin-bottom: 0; }
    .event-small-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 24px;
      align-items: start;
    }
    .event-card--row { display: flex; gap: 1.25rem; align-items: flex-start; }
    .event-card-flyer { flex: 0 0 48%; min-width: 0; }
    .event-card-text { flex: 1; min-width: 0; }
    .events-footer {
      padding: 40px 60px 56px;
      display: flex;
      justify-content: flex-end;
    }
    .archive-link {
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .archive-link:hover { color: var(--accent-light); }
    @media (max-width: 768px) {
      .events-header { padding: 36px 24px 12px; flex-direction: column; align-items: flex-start; gap: 16px; }
      .events-grid-wrap { padding: 32px 24px 0; }
      .event-feature { grid-template-columns: 1fr; gap: 20px; }
      .event-small-grid { grid-template-columns: 1fr; }
      .event-card--row { flex-direction: column; gap: 0.75rem; }
      .event-card-flyer { flex: none; width: 100%; }
      .events-footer { padding: 32px 24px 40px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link">
        <img src="../assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo">
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/">The Work</a></li>
        <li><a href="/events/" class="active">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/">Writers</a></li>
        <li><a href="/contributors/">Contributors</a></li>
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <div class="events-header">
    <div>
      <p class="events-label">Events</p>
      <p class="events-tagline" id="events-tagline">Where the Guild shows up in person.</p>
    </div>
  </div>

  <hr class="events-divider">

  <div class="events-grid-wrap">
    <div id="events-grid">
      <!-- Populated by Sanity -->
    </div>
  </div>

  <div class="events-footer">
    <a href="/events/archive/" class="archive-link">Every event →</a>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchEvents, renderEventCard, renderEventFeature, showLoading, showError, fetchSitePageCopy } from '../js/sanity.js'
    const grid = document.getElementById('events-grid')

    // Visitor's local date as YYYY-MM-DD (not toISOString, which is UTC).
    function localToday() {
      const d = new Date()
      const p = n => String(n).padStart(2, '0')
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
    }

    // Upcoming (today counts) soonest first; the first 3 are large blocks.
    // With nothing upcoming, the newest past event takes the large slot.
    // The grid of 4 fills from upcoming overflow, then past newest first.
    function layoutEvents(events) {
      const today = localToday()
      const upcoming = events.filter(e => e.eventDate && e.eventDate >= today)
        .sort((a, b) => a.eventDate.localeCompare(b.eventDate))
      let past = events.filter(e => !(e.eventDate && e.eventDate >= today)) // already newest first
      let large = upcoming.slice(0, 3)
      let overflow = upcoming.slice(3)
      if (!large.length) {
        large = past.slice(0, 1)
        past = past.slice(1)
      }
      const small = overflow.concat(past).slice(0, 4)
      return { large, small }
    }

    showLoading(grid)
    fetchEvents(50)
      .then(events => {
        if (!events || !events.length) {
          showError(grid, 'No events on the calendar right now — check back soon.')
          return
        }
        const { large, small } = layoutEvents(events)
        grid.innerHTML =
          `<div class="event-features">${large.map(renderEventFeature).join('')}</div>` +
          (small.length
            ? `<div class="event-small-grid">${small.map(e => renderEventCard(e, { row: true })).join('')}</div>`
            : '')
      })
      .catch(() => showError(grid, 'Events unavailable.'))

    // Same mechanism as every other preview-aware page — see
    // the-porch/story/index.html for the full explanation.
    function isPreviewing() {
      return document.cookie.split('; ').some(c => c.indexOf('swg_preview_active=') === 0)
    }

    function fetchCopy() {
      if (!isPreviewing()) return fetchSitePageCopy()
      return fetch('/api/preview-singleton?type=sitePageCopy')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchSitePageCopy())
    }

    fetchCopy()
      .then(copy => {
        if (!copy) return
        const taglineEl = document.getElementById('events-tagline')
        if (taglineEl && copy.eventsTagline) taglineEl.textContent = copy.eventsTagline
        if (copy.eventsMetaDescription) {
          const meta = document.querySelector('meta[name="description"]')
          if (meta) meta.setAttribute('content', copy.eventsMetaDescription)
        }
      })
      .catch(() => {})
  </script>

  <script src="../js/nav.js"></script>
</body>
</html>
